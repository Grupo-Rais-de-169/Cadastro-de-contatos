apiVersion: apps/v1
kind: Deployment
metadata:
  name: daoapi
spec:
  replicas: 3
  template:
    metadata:
      labels:
        app: daoapi
    spec:
      containers:
      - name: daoapi
        image: gustascarvalho/dao_api:latest
        ports:
        - containerPort: 80
        env:
        - name: ASPNETCORE_URLS
          value: http://*:80
  selector:
    matchLabels:
        app: daoapi
