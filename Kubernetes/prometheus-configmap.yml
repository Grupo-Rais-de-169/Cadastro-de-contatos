apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global: 
      scrape_interval: 5s

    scrape_configs:
      - job_name: 'Prometheus-Cadastro-Api'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['cadastro-api:8080']

      - job_name: 'Prometheus-DAO-Api'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['dao-api:8080']