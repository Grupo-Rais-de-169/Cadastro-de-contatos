# =======================================
# DEPLOYMENTS + SERVICES PARA KUBERNETES
# =======================================
# Cada serviço do seu docker-compose foi separado em:
# - Deployment (com replica 1, pode ajustar)
# - Service (tipo ClusterIP para acesso interno)

apiVersion: v1
kind: ConfigMap
metadata:
    name: db-config
data:
    CONNECTION_STRING: "Host=aws-0-sa-east-1.pooler.supabase.com;Port=6543;Username=postgres.uiviwynagxzmwoilaehs;Password=Mushroom$875985;Database=postgres;Pooling=false;"   

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cadastro-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cadastro-api
  template:
    metadata:
      labels:
        app: cadastro-api
    spec:
      containers:
        - name: cadastro-api
          image: gustascarvalho/cadastro_api:1.0  # ou substitua com imagem certa
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_URLS
              value: http://+:8080
---
apiVersion: v1
kind: Service
metadata:
  name: cadastro-api
spec:
  selector:
    app: cadastro-api
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30081
  type: NodePort

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dao-api
spec:
  replicas: 1
  template:
    metadata:
      labels:
        app: dao-api
    spec:
      containers:
      - name: dao-api
        image: gustascarvalho/dao_api:latest
        ports:
        - containerPort: 80
        env:
        - name: CONNECTION_STRING
          valueFrom:
            configMapKeyRef:
                name: db-config
                key: CONNECTION_STRING
  selector:
    matchLabels:
        app: dao-api

---
apiVersion: v1
kind: Service
metadata:
  name: dao-api
spec:
  selector:
    app: dao-api
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30082
  type: NodePort

